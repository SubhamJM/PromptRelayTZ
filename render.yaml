services:
  - type: web
    name: prompt-relay
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: "groq"
      - key: DEFAULT_MODEL_NAME
        value: "qwen/qwen3.8-27b"
      - key: MODEL_TIMEOUT_SECONDS
        value: "15"
      - key: FALLBACK_TO_OFFLINE
        value: "true"
      - key: PROJECT_NAME
        value: "Prompt Relay: Multi-Agent Tournament"
